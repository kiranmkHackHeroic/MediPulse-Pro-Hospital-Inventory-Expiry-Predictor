version: '3.8'

# ==============================================================================
# MediPulse Pro : Enterprise Hospital Inventory & Consumable Expiry Predictor
# Multi-Container Production-Grade Docker Compose Topology
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. MySQL 8 Database Service (Local Containerized Environment)
  # ----------------------------------------------------------------------------
  medipulse-mysql:
    image: mysql:8.0
    container_name: medipulse-mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Kiran@123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-businessproject}
    ports:
      - "3306:3306"
    volumes:
      - medipulse-mysql-data:/var/lib/mysql
    networks:
      - medipulse-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 2. MediPulse Pro Spring Boot Application Engine
  # ----------------------------------------------------------------------------
  medipulse-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medipulse-backend-api
    restart: unless-stopped
    ports:
      - "2330:2330"
    environment:
      PORT: 2330
      # Connects to local containerized MySQL by default, or accepts cloud Aiven URL via env
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://medipulse-mysql:3306/businessproject}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-Kiran@123}
    depends_on:
      medipulse-mysql:
        condition: service_healthy
    networks:
      - medipulse-net

# ------------------------------------------------------------------------------
# Isolated Bridge Network
# ------------------------------------------------------------------------------
networks:
  medipulse-net:
    driver: bridge
    name: medipulse-net

# ------------------------------------------------------------------------------
# Persistent Data Volumes
# ------------------------------------------------------------------------------
volumes:
  medipulse-mysql-data:
    name: medipulse-mysql-data
