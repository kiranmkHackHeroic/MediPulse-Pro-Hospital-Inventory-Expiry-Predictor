<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediPulse Pro : Hospital Inventory & Consumable Expiry Predictor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/Navigation.css}">
    <link rel="stylesheet" th:href="@{/css/AiWidget.css}">
</head>
<body>
    <div th:fragment="navbar()">
        <!-- Top Hospital Announcement & GitHub Link Bar -->
        <div class="top-announcement-bar">
            <div class="top-bar-inner">
                <div class="top-bar-left">
                    <span class="live-pulse-dot"></span>
                    <span><strong>MediPulse Pro v1.0</strong> • Intelligent Hospital Supply Chain & Expiry Radar</span>
                </div>
                <div class="top-bar-right">
                    <a href="https://github.com/kiranmkHackHeroic/MediPulse-Pro-Hospital-Inventory-Expiry-Predictor" target="_blank" rel="noopener noreferrer" class="top-github-link">
                        <i class="fa-brands fa-github"></i> <span>Star on GitHub</span> <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 0.7rem;"></i>
                    </a>
                </div>
            </div>
        </div>

        <!-- Main Hospital Navigation Bar -->
        <nav class="navbar-container">
            <div class="navbar">
                <a href="/home" class="nav-brand">
                    <div class="brand-icon-box" style="background: linear-gradient(135deg, #0ea5e9, #0284c7);">
                        <i class="fa-solid fa-heart-pulse"></i>
                    </div>
                    <div class="brand-text">
                        <span class="brand-name">MEDIPULSE<span>PRO</span></span>
                        <span class="brand-tag">Hospital Supply Chain & Expiry Radar</span>
                    </div>
                </a>

                <button class="mobile-toggle" onclick="document.querySelector('.nav-links').classList.toggle('active')">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <ul class="nav-links">
                    <li><a href="/home" class="nav-link"><i class="fa-solid fa-house-medical"></i> Overview</a></li>
                    <li><a href="/products" class="nav-link"><i class="fa-solid fa-pills"></i> Medical Formulary</a></li>
                    <li><a href="/about" class="nav-link"><i class="fa-solid fa-truck-medical"></i> Cold Chain & Ops</a></li>
                    <li><a href="/location" class="nav-link"><i class="fa-solid fa-warehouse"></i> Supply Depots</a></li>
                    <li class="nav-actions">
                        <a href="https://github.com/kiranmkHackHeroic/MediPulse-Pro-Hospital-Inventory-Expiry-Predictor" target="_blank" rel="noopener noreferrer" class="btn-nav-github" title="View Source on GitHub">
                            <i class="fa-brands fa-github"></i> <span>GitHub</span>
                        </a>
                        <a href="/register" class="btn-nav-register"><i class="fa-solid fa-id-badge"></i> Register Ward</a>
                        <a href="/login" class="btn-nav-login" style="background: linear-gradient(135deg, #0284c7, #0369a1);"><i class="fa-solid fa-user-doctor"></i> Staff / Admin Portal</a>
                    </li>
                </ul>
            </div>
        </nav>
        <link rel="stylesheet" th:href="@{/css/AiWidget.css}">
        <script th:src="@{/JavaScript/AiWidget.js}"></script>
    </div>
</body>
</html>
