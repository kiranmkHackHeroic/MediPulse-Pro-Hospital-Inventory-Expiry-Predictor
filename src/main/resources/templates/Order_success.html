<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>MediPulse Pro : Ward Indent Confirmed</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: 'Plus Jakarta Sans', sans-serif;
		}

		body {
			background: radial-gradient(circle at center, rgba(2, 132, 199, 0.08) 0%, #f0fdfa 100%);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 2rem 1.5rem;
		}

		.receipt-card {
			background: #ffffff;
			border-radius: 24px;
			box-shadow: 0 20px 40px -10px rgba(2, 132, 199, 0.1), 0 0 1px 1px rgba(224, 242, 254, 0.8);
			max-width: 490px;
			width: 100%;
			text-align: center;
			overflow: hidden;
			animation: slideUp 0.4s ease;
			border: 1px solid #e0f2fe;
		}

		.receipt-header {
			background: linear-gradient(135deg, #0c4a6e, #0284c7);
			color: #ffffff;
			padding: 3rem 2rem 2.5rem;
			position: relative;
		}

		.receipt-header::after {
			content: '';
			position: absolute;
			bottom: -10px;
			left: 0;
			right: 0;
			height: 20px;
			background: #ffffff;
			border-radius: 20px 20px 0 0;
		}

		.check-icon-circle {
			width: 72px;
			height: 72px;
			border-radius: 50%;
			background: #ffffff;
			color: #0284c7;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			font-size: 2.2rem;
			box-shadow: 0 8px 25px rgba(2, 132, 199, 0.25);
			margin-bottom: 1.25rem;
		}

		.receipt-title {
			font-family: 'Outfit', sans-serif;
			font-size: 1.6rem;
			font-weight: 800;
			margin-bottom: 0.35rem;
		}

		.receipt-subtitle {
			font-size: 0.9rem;
			color: #bae6fd;
		}

		.receipt-body {
			padding: 2rem 2.25rem 2.5rem;
		}

		.amount-badge-box {
			background: #f0f9ff;
			border: 1.5px dashed #7dd3fc;
			border-radius: 16px;
			padding: 1.5rem;
			margin-bottom: 2rem;
		}

		.amount-label {
			font-size: 0.8rem;
			color: #0369a1;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 1px;
			margin-bottom: 0.25rem;
		}

		.amount-value {
			font-family: 'Outfit', sans-serif;
			font-size: 2.25rem;
			font-weight: 800;
			color: #0284c7;
		}

		.receipt-details {
			color: #475569;
			font-size: 0.95rem;
			line-height: 1.6;
			margin-bottom: 2rem;
		}

		.btn-continue {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 0.5rem;
			background: linear-gradient(135deg, #0284c7, #0d9488);
			color: #ffffff;
			text-decoration: none;
			padding: 0.85rem 2rem;
			border-radius: 12px;
			font-family: 'Outfit', sans-serif;
			font-weight: 700;
			font-size: 0.95rem;
			width: 100%;
			box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
			transition: all 0.2s ease;
		}

		.btn-continue:hover {
			transform: translateY(-2px);
			box-shadow: 0 8px 20px rgba(13, 148, 136, 0.45);
			background: linear-gradient(135deg, #0369a1, #0f766e);
		}

		@keyframes slideUp {
			from { opacity: 0; transform: translateY(20px); }
			to { opacity: 1; transform: translateY(0); }
		}
	</style>
</head>

<body>
	<div class="receipt-card">
		<div class="receipt-header">
			<div class="check-icon-circle">
				<i class="fa-solid fa-truck-medical"></i>
			</div>
			<h1 class="receipt-title">Ward Indent Dispatched!</h1>
			<p class="receipt-subtitle">Central Hospital Pharmacy has received your indent</p>
		</div>

		<div class="receipt-body">
			<div class="amount-badge-box">
				<div class="amount-label">Total Consumable Indent Value</div>
				<div class="amount-value" th:text="'₹ ' + ${amount}">₹ 4,999.00</div>
			</div>

			<p class="receipt-details">
				Your clinical supplies have been prioritized in the Central Pharmacy queue with FEFO batch allocation. Delivery to your clinical ward unit is underway.
			</p>

			<a href="/product/back" class="btn-continue">
				<i class="fa-solid fa-arrow-left"></i> Return to Ward Workspace
			</a>
		</div>
	</div>
</body>
</html>
