<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>NexusSoft : License Provisioned</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: 'Plus Jakarta Sans', sans-serif;
		}

		body {
			background: radial-gradient(circle at center, rgba(37, 99, 235, 0.08) 0%, #f8fafc 100%);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 2rem 1.5rem;
		}

		.receipt-card {
			background: #ffffff;
			border-radius: 24px;
			box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.08), 0 0 1px 1px rgba(226, 232, 240, 0.8);
			max-width: 480px;
			width: 100%;
			text-align: center;
			overflow: hidden;
			animation: slideUp 0.4s ease;
		}

		.receipt-header {
			background: linear-gradient(135deg, #1e3a8a, #2563eb);
			color: #ffffff;
			padding: 3rem 2rem 2.5rem;
			position: relative;
		}

		.receipt-header::after {
			content: '';
			position: absolute;
			bottom: -10px;
			left: 0;
			right: 0;
			height: 20px;
			background: #ffffff;
			border-radius: 20px 20px 0 0;
		}

		.check-icon-circle {
			width: 72px;
			height: 72px;
			border-radius: 50%;
			background: #ffffff;
			color: #2563eb;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			font-size: 2.2rem;
			box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
			margin-bottom: 1.25rem;
		}

		.receipt-title {
			font-size: 1.6rem;
			font-weight: 800;
			margin-bottom: 0.35rem;
		}

		.receipt-subtitle {
			font-size: 0.9rem;
			color: #93c5fd;
		}

		.receipt-body {
			padding: 2rem 2.25rem 2.5rem;
		}

		.amount-badge-box {
			background: #eff6ff;
			border: 1.5px dashed #93c5fd;
			border-radius: 16px;
			padding: 1.5rem;
			margin-bottom: 2rem;
		}

		.amount-label {
			font-size: 0.8rem;
			color: #1e40af;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 1px;
			margin-bottom: 0.25rem;
		}

		.amount-value {
			font-size: 2.25rem;
			font-weight: 800;
			color: #2563eb;
		}

		.receipt-details {
			color: #64748b;
			font-size: 0.95rem;
			line-height: 1.6;
			margin-bottom: 2rem;
		}

		.btn-continue {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 0.5rem;
			background: linear-gradient(135deg, #2563eb, #1d4ed8);
			color: #ffffff;
			text-decoration: none;
			padding: 0.85rem 2rem;
			border-radius: 12px;
			font-weight: 700;
			font-size: 0.95rem;
			width: 100%;
			box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
			transition: all 0.2s ease;
		}

		.btn-continue:hover {
			transform: translateY(-2px);
			box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
		}

		@keyframes slideUp {
			from { opacity: 0; transform: translateY(20px); }
			to { opacity: 1; transform: translateY(0); }
		}
	</style>
</head>

<body>
	<div class="receipt-card">
		<div class="receipt-header">
			<div class="check-icon-circle">
				<i class="fa-solid fa-check"></i>
			</div>
			<h1 class="receipt-title">License Activated!</h1>
			<p class="receipt-subtitle">Thank you for choosing NexusSoft Platform</p>
		</div>

		<div class="receipt-body">
			<div class="amount-badge-box">
				<div class="amount-label">Total Invoiced Amount</div>
				<div class="amount-value" th:text="'₹ ' + ${amount}">₹ 4,999.00</div>
			</div>

			<p class="receipt-details">
				Your software license seats have been provisioned and allocated to your workspace tenant. API keys and deployment credentials are now active.
			</p>

			<a href="/product/back" class="btn-continue">
				<i class="fa-solid fa-arrow-left"></i> Return to Client Workspace
			</a>
		</div>
	</div>
</body>
</html>
