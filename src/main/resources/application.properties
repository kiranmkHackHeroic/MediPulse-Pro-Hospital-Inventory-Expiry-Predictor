# Dynamic Port: uses cloud PORT env variable (e.g. Render) or falls back to 2330
server.port=${PORT:2330}

# Dynamic Cloud MySQL Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-3e092a2-kiranmk1803-0593.a.aivencloud.com:14073/defaultdb?ssl-mode=REQUIRED}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Auto DDL: creates or updates tables automatically on cloud startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
