# Dynamic Port: uses cloud PORT env variable (e.g. Render) or falls back to 2330
server.port=${PORT:2330}

# Database Connection (H2 in MySQL compatibility mode - zero cloud setup needed)
spring.datasource.url=jdbc:h2:mem:businessproject;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
