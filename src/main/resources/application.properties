# Dynamic Port: uses cloud PORT env variable (e.g. Render / Railway) or falls back to 2330
server.port=${PORT:2330}

# Dynamic Cloud MySQL Connection: reads cloud variables or falls back to local database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/businessproject}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Root1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Auto DDL: creates or updates tables automatically on cloud startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

