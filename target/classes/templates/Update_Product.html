<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>MediPulse Pro : Update Formulary Item</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
	<link rel="stylesheet" th:href="@{/css/Add_Product.css}" />
</head>

<body>
	<div class="form-modal-card">
		<div class="form-modal-header" style="background: linear-gradient(135deg, #0c4a6e, #0284c7);">
			<div class="form-modal-icon" style="background: rgba(255, 255, 255, 0.2);"><i class="fa-solid fa-pen-to-square"></i></div>
			<h2 class="form-modal-title" style="font-family: 'Outfit', sans-serif;">Update Formulary Consumable</h2>
		</div>

		<div class="form-modal-body">
			<form th:action="@{'/updatingProduct/' + ${product.pid}}" method="post" th:object="${product}">
				<div class="form-group">
					<label>Trade / Brand Name</label>
					<input type="text" name="pname" th:value="${product.pname}" required />
				</div>

				<div class="form-group">
					<label>Generic / Active Chemical Formulation</label>
					<input type="text" name="genericName" th:value="${product.genericName}" required />
				</div>

				<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
					<div class="form-group">
						<label>Clinical Category</label>
						<input type="text" name="category" th:value="${product.category}" required />
					</div>

					<div class="form-group">
						<label>Dosage Form</label>
						<input type="text" name="dosageForm" th:value="${product.dosageForm}" required />
					</div>
				</div>

				<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
					<div class="form-group">
						<label>Storage Temperature / Cold-Chain</label>
						<input type="text" name="storageTemp" th:value="${product.storageTemp}" required />
					</div>

					<div class="form-group">
						<label>Unit Acquisition Cost (INR)</label>
						<input type="number" step="0.01" name="pprice" th:value="${product.pprice}" required />
					</div>
				</div>

				<div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem;">
					<div class="form-group">
						<label>Min Safety Stock</label>
						<input type="number" name="minSafetyStock" th:value="${product.minSafetyStock}" required />
					</div>
					<div class="form-group">
						<label>Reorder Point (ROP)</label>
						<input type="number" name="reorderPoint" th:value="${product.reorderPoint}" required />
					</div>
					<div class="form-group">
						<label>Lead Time (Days)</label>
						<input type="number" name="leadTimeDays" th:value="${product.leadTimeDays}" required />
					</div>
				</div>

				<div class="form-group">
					<label>Est. Daily Hospital Burn Rate (Units/Day)</label>
					<input type="number" step="0.1" name="dailyBurnRate" th:value="${product.dailyBurnRate}" required />
				</div>

				<div class="btn-group">
					<a th:href="@{/admin/services}" class="btn-cancel-form">Cancel</a>
					<button type="submit" class="btn-submit-form" style="background: linear-gradient(135deg, #0284c7, #0d9488);">
						<i class="fa-solid fa-check"></i> Save Formulary Changes
					</button>
				</div>
			</form>
		</div>
	</div>
</body>
</html>
