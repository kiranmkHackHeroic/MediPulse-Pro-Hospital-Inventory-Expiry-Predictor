<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Admin : Add Enterprise Client</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
	<link rel="stylesheet" th:href="@{/css/Add_User.css}" />
</head>

<body>
	<div class="form-modal-card">
		<div class="form-modal-header">
			<div class="form-modal-icon"><i class="fa-solid fa-building-user"></i></div>
			<h2 class="form-modal-title">Add Enterprise Client</h2>
		</div>

		<div class="form-modal-body">
			<form th:action="@{/addingUser}" method="post">
				<div class="form-group">
					<label>Client Organization / Contact Name</label>
					<input type="text" name="uname" placeholder="Full name / Org..." required />
				</div>

				<div class="form-group">
					<label>Corporate Email</label>
					<input type="email" name="uemail" placeholder="contact@company.com" required />
				</div>

				<div class="form-group">
					<label>Phone Number</label>
					<input type="tel" name="unumber" placeholder="10-digit phone number" pattern="[0-9]{10}" required />
				</div>

				<input type="hidden" name="upassword" value="1234" />

				<div class="btn-group">
					<a th:href="@{/admin/services}" class="btn-cancel-form">Cancel</a>
					<button type="submit" class="btn-submit-form">
						<i class="fa-solid fa-check"></i> Register Client
					</button>
				</div>
			</form>
		</div>
	</div>
</body>
</html>
