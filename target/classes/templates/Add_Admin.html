<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Admin : Add Administrator</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
	<link rel="stylesheet" th:href="@{/css/Add_Admin.css}" />
</head>

<body>
	<div class="form-modal-card">
		<div class="form-modal-header">
			<div class="form-modal-icon"><i class="fa-solid fa-user-shield"></i></div>
			<h2 class="form-modal-title">Add Administrator</h2>
		</div>

		<div class="form-modal-body">
			<form th:action="@{/addingAdmin}" method="post">
				<div class="form-group">
					<label>Admin Full Name</label>
					<input type="text" name="adminName" placeholder="e.g. Suhas K" required />
				</div>

				<div class="form-group">
					<label>Admin Email</label>
					<input type="email" name="adminEmail" placeholder="admin@pavantea.com" required />
				</div>

				<div class="form-group">
					<label>Contact Number</label>
					<input type="tel" name="adminNumber" placeholder="10-digit mobile number" pattern="[0-9]{10}" required />
				</div>

				<div class="form-group">
					<label>Admin Password</label>
					<input type="password" name="adminPassword" placeholder="••••••••" required />
				</div>

				<div class="btn-group">
					<a th:href="@{/admin/services}" class="btn-cancel-form">Cancel</a>
					<button type="submit" class="btn-submit-form">
						<i class="fa-solid fa-check"></i> Save Administrator
					</button>
				</div>
			</form>
		</div>
	</div>
</body>
</html>
