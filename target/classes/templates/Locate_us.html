<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>MediPulse Pro : Medical Supply Depots & Cold-Chain Logistics Hubs</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
	<link rel="stylesheet" th:href="@{/css/Navigation.css}" />
	<link rel="stylesheet" th:href="@{/css/Locate_us.css}" />
</head>

<body>
	<nav th:replace="~{Navigation::navbar()}"></nav>

	<main class="location-container">
		<div class="location-header">
			<span class="location-tag" style="background: rgba(2, 132, 199, 0.1); color: #0284c7; border: 1px solid rgba(2, 132, 199, 0.2);">Distribution Network</span>
			<h1 class="location-title">Central Medical Warehouses & Cold-Chain Depots</h1>
		</div>

		<div class="map-card">
			<div class="map-frame-wrapper">
				<iframe 
					src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7893655.513234244!2d71.02106038976581!3d14.974710144524717!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3ba35a4c37bf488f%3A0x41f1d28cd1757cd5!2sKarnataka!5e0!3m2!1sen!2sin!4v1695007509155!5m2!1sen!2sin" 
					allowfullscreen="" 
					loading="lazy" 
					referrerpolicy="no-referrer-when-downgrade">
				</iframe>
			</div>

			<div class="location-details-bar">
				<div class="loc-badge">
					<div class="loc-icon" style="color: #0284c7;"><i class="fa-solid fa-snowflake"></i></div>
					<div class="loc-text">
						<h4>Primary Cold-Chain Hub</h4>
						<p>2°C - 8°C GxP Certified Facility</p>
					</div>
				</div>

				<div class="loc-badge">
					<div class="loc-icon" style="color: #0284c7;"><i class="fa-solid fa-truck-fast"></i></div>
					<div class="loc-text">
						<h4>Emergency Dispatch Desk</h4>
						<p>Sub-2 Hour Trauma OT Delivery SLA</p>
					</div>
				</div>

				<div class="loc-badge">
					<div class="loc-icon" style="color: #0284c7;"><i class="fa-solid fa-warehouse"></i></div>
					<div class="loc-text">
						<h4>Regional Buffer Depots</h4>
						<p>Multi-Region Hospital Consignment Stores</p>
					</div>
				</div>
			</div>
		</div>
	</main>
</body>
</html>
