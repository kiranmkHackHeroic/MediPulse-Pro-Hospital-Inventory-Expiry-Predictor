# ==============================================================================
# Render Infrastructure Blueprint
# MediPulse Pro : Hospital Inventory & Consumable Expiry Predictor
# ==============================================================================

services:
  - type: web
    name: medipulse-pro
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
